<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScriptureBridge</title>
<meta http-equiv="refresh" content="0; url=/apps/scripturebridge/">
<style>body{margin:0;background:#070f2c;color:#f4f6fb;font:17px/1.5 system-ui,-apple-system,sans-serif;padding:2rem}a{color:#81a7fc}</style>
</head>
<body>
<p>The preview is now the live app. <a href="/apps/scripturebridge/">Open ScriptureBridge</a>.</p>
<script>
  // Remove the preview's old offline cache, then go to the live app.
  (async () => {
    try {
      const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
      await Promise.all(regs.filter(r => r.scope.includes('/scripturebridge-next/')).map(r => r.unregister()));
      const keys = await caches?.keys?.() || [];
      await Promise.all(keys.filter(k => k.startsWith('sbn-')).map(k => caches.delete(k)));
    } catch (e) {}
    location.replace('/apps/scripturebridge/' + location.hash);
  })();
</script>
</body>
</html>

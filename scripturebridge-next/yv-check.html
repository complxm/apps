<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YouVersion check</title>
<style>
  :root { color-scheme: light dark; --bg: #f3eee5; --fg: #1d1a16; --muted: #6b6257; --card: #fbf8f2; --accent: #8f622c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0f12; --fg: #ece7de; --muted: #a39a8c; --card: #161920; --accent: #e5b869; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  p { color: var(--muted); margin: 0 0 1rem; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 0.75rem 1rem; border-radius: 999px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); margin-bottom: 0.75rem; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 0.75rem 1.25rem; background: var(--accent); color: var(--bg); width: 100%; margin-bottom: 0.75rem; }
  pre { background: var(--card); border-radius: 1rem; padding: 1rem; white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <h1>YouVersion check</h1>
  <p>Paste your YouVersion app key and tap Check. It lists the Polish Bibles the key unlocks and reads a few verses from the EIB Bible. The key stays on this phone and is not shown in the result. When it says Done, tap Copy and paste the result into the chat.</p>
  <input id="key" type="password" autocomplete="off" placeholder="App key">
  <button id="run" type="button">Check</button>
  <button id="copy" type="button">Copy result</button>
  <pre id="out">Waiting for the key…</pre>
</main>
<script>
const API = 'https://api.youversion.com/v1';
const out = document.getElementById('out');
let KEY = '';
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };
async function get(path) {
  const r = await fetch(API + path, { headers: { 'X-YVP-App-Key': KEY } });
  const text = await r.text();
  let json = null; try { json = JSON.parse(text); } catch (e) {}
  return { status: r.status, json, text };
}
const short = (b) => `${b.id} | ${b.abbreviation} | ${b.title} | ${b.language_tag} | books ${Array.isArray(b.books) ? b.books.length : '?'}`;
async function run() {
  lines.length = 0;
  log('origin ' + location.origin + ' · ' + new Date().toISOString());
  try {
    const mine = await get('/bibles?language_ranges[]=pl&page_size=99');
    log(`\n== Polish Bibles this key unlocks (HTTP ${mine.status})`);
    (mine.json?.data || []).forEach((b) => log(short(b)));
    if (!mine.json) log(mine.text.slice(0, 400));
    const all = await get('/bibles?language_ranges[]=pl&page_size=99&all_available=true');
    log(`\n== All Polish Bibles on the platform (HTTP ${all.status})`);
    (all.json?.data || []).forEach((b) => log(short(b)));
    const ids = new Set((mine.json?.data || []).map((b) => b.id));
    const usable = [2095, 3881, 3490].filter((id) => ids.has(id));
    log(`\nUsable: ${usable.length ? usable.join(', ') : 'none of 2095 / 3881 / 3490'}`);
    for (const id of (usable.length ? usable : [2095]).slice(0, 2)) {
      const meta = await get(`/bibles/${id}`);
      log(`\n== Bible ${id} (HTTP ${meta.status})`);
      if (meta.json) log(`copyright: ${meta.json.copyright || ''}\npromo: ${(meta.json.promotional_content || '').slice(0, 300)}`);
      else log(meta.text.slice(0, 300));
      const html = await get(`/bibles/${id}/passages/GEN.1?format=html&include_headings=false&include_notes=false`);
      log(`\n-- GEN.1 html (HTTP ${html.status})`);
      log((html.json?.content || html.text).slice(0, 1800));
      const txt = await get(`/bibles/${id}/passages/GEN.1.1-GEN.1.3?format=text`);
      log(`\n-- GEN.1.1-3 text (HTTP ${txt.status})`);
      log((txt.json?.content || txt.text).slice(0, 600));
      const v = await get(`/bibles/${id}/passages/ISA.7.14?format=text`);
      log(`\n-- ISA.7.14 (HTTP ${v.status})\n${(v.json?.content || v.text).slice(0, 400)}`);
    }
    log('\nDone.');
  } catch (e) {
    log('\nERROR ' + e.name + ': ' + e.message);
    log('(If this says "Load failed" or "Failed to fetch", the browser blocked the request: YouVersion may not allow calls from web pages.)');
  }
}
document.getElementById('run').addEventListener('click', () => { KEY = document.getElementById('key').value.trim(); if (KEY) run(); });
document.getElementById('copy').addEventListener('click', async () => {
  const b = document.getElementById('copy');
  try { await navigator.clipboard.writeText(out.textContent); b.textContent = 'Copied'; } catch (e) { b.textContent = 'Select the text and copy it'; }
});
</script>
</body>
</html>

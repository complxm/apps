<script>
  // FVL context: the neutrals follow the OS — warm stone (dawn) in light, obsidian (day) in dark.
  (function () {
    var q = matchMedia('(prefers-color-scheme: dark)');
    var set = function () { document.documentElement.dataset.daylight = q.matches ? 'day' : 'dawn'; };
    set();
    if (q.addEventListener) q.addEventListener('change', set);
  })();
</script>

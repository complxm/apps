<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7fa" media="(prefers-color-scheme: light)">
<title>Two Seats of Time</title>
<link rel="icon" href="/apps/vendor/fvl/brand/favicon.svg">
<link rel="stylesheet" href="/apps/vendor/fvl/css/fonts.css">
<link rel="stylesheet" href="/apps/vendor/fvl/css/fvl.css">
<script>
  // FVL context: daylight from the clock (dawn 05–09, day 09–17, dusk 17–21, night 21–05). Theme follows the OS.
  (function () {
    var h = new Date().getHours();
    document.documentElement.dataset.daylight = h < 5 ? 'night' : h < 9 ? 'dawn' : h < 17 ? 'day' : h < 21 ? 'dusk' : 'night';
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fvl-color-bg-canvas);
    color: var(--fvl-color-text-primary);
    font-family: var(--fvl-type-body-family);
    font-size: var(--fvl-type-body-size);
    line-height: var(--fvl-type-body-line-height);
    letter-spacing: var(--fvl-type-body-tracking);
    font-feature-settings: var(--fvl-type-body-features);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }

  .app {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    display: grid;
    gap: var(--fvl-space-stack-related);
    padding: var(--fvl-space-stack-group) var(--fvl-layout-margin-compact) 0;
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--fvl-space-icon-gap); }
  .title {
    margin: 0;
    font-family: var(--fvl-type-h3-family);
    font-size: var(--fvl-type-h3-size);
    font-weight: var(--fvl-type-h3-weight);
    line-height: var(--fvl-type-h3-line-height);
    letter-spacing: var(--fvl-type-h3-tracking);
  }
  .seat {
    font-size: var(--fvl-type-label-size);
    font-weight: var(--fvl-type-label-weight);
    letter-spacing: var(--fvl-type-label-tracking);
    color: var(--fvl-color-text-secondary);
    transition: color var(--fvl-motion-tone);
  }
  .seat[data-seat="outside"] { color: var(--fvl-color-accent-text); }
  .chapters { display: flex; align-items: center; gap: var(--fvl-space-icon-gap); }
  .chapters span {
    height: 2px; flex: 1; border-radius: var(--fvl-radius-pill);
    background: var(--fvl-color-line-subtle);
    transition: background var(--fvl-motion-tone);
  }
  .chapters span.done { background: var(--fvl-color-line-strong); }
  .chapters span.current { background: var(--fvl-color-accent-default); }
  .chapter-name {
    font-size: var(--fvl-type-micro-size);
    font-weight: var(--fvl-type-label-weight);
    letter-spacing: var(--fvl-type-label-tracking);
    text-transform: uppercase;
    color: var(--fvl-color-text-muted);
    font-variant-numeric: var(--fvl-type-data-numeric);
  }

  /* ---- stage ---- */
  .stage {
    position: relative;
    min-height: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage svg { display: block; width: 100%; height: 100%; }

  .seg { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-width: var(--fvl-stroke-default); }
  .seg.walked { stroke: var(--fvl-color-line-strong); }
  .seg.open { stroke: var(--fvl-color-line-subtle); stroke-dasharray: 3 7; }
  .seg.commit { stroke: var(--fvl-color-accent-default); stroke-width: 2px; stroke-dasharray: none; }
  .seg.bet { stroke: var(--fvl-color-text-primary); stroke-width: 2px; stroke-dasharray: none; }
  .seg.bet.dark { stroke: var(--fvl-color-line-subtle); stroke-width: var(--fvl-stroke-default); stroke-dasharray: 3 7; }
  .seg.commit, .seg.bet { transition: stroke var(--fvl-motion-tone); }

  .fork { fill: var(--fvl-color-bg-canvas); stroke: var(--fvl-color-line-strong); vector-effect: non-scaling-stroke; stroke-width: var(--fvl-stroke-default); }
  .print { fill: var(--fvl-color-text-muted); opacity: 0.55; }
  .print.his { fill: var(--fvl-color-accent-subtle); stroke: var(--fvl-color-accent-default); vector-effect: non-scaling-stroke; stroke-width: 1px; opacity: 1; }
  .lantern { fill: var(--fvl-color-accent-subtle); stroke: var(--fvl-color-accent-default); vector-effect: non-scaling-stroke; stroke-width: var(--fvl-stroke-default); }
  .fire { fill: none; stroke: var(--fvl-color-line-strong); vector-effect: non-scaling-stroke; stroke-width: var(--fvl-stroke-default); }
  .end { fill: none; stroke: var(--fvl-color-accent-default); vector-effect: non-scaling-stroke; stroke-width: 2px; stroke-linecap: round; }
  .walker { fill: var(--fvl-color-accent-default); }
  .ripple { fill: none; stroke: var(--fvl-color-accent-default); vector-effect: non-scaling-stroke; stroke-width: var(--fvl-stroke-default); pointer-events: none; }

  /* ---- card ---- */
  .card {
    margin: 0 var(--fvl-layout-margin-compact);
    margin-bottom: var(--fvl-space-stack-group);
    padding: var(--fvl-space-inset-container);
    border-radius: var(--fvl-radius-container);
    background: var(--fvl-color-bg-surface);
    display: grid;
    gap: var(--fvl-space-stack-group);
    max-width: var(--fvl-layout-width-prose);
    justify-self: center;
    width: calc(100% - 2 * var(--fvl-layout-margin-compact));
  }
  .card p { margin: 0; color: var(--fvl-color-text-secondary); min-height: 3lh; }
  .card p b { color: var(--fvl-color-text-primary); font-weight: var(--fvl-type-label-weight); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--fvl-space-icon-gap); align-items: center; }
  .btn {
    appearance: none; border: 0; margin: 0;
    height: var(--fvl-size-control-md);
    padding: 0 var(--fvl-space-inset-control-x);
    border-radius: var(--fvl-radius-pill);
    font: inherit;
    font-size: var(--fvl-type-label-size);
    font-weight: var(--fvl-type-label-weight);
    letter-spacing: var(--fvl-type-label-tracking);
    cursor: pointer;
    -webkit-user-select: none; user-select: none;
    transition: background var(--fvl-motion-tone), color var(--fvl-motion-tone), transform var(--fvl-motion-spring-press-duration) var(--fvl-motion-spring-press-easing);
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: var(--fvl-stroke-focus) solid var(--fvl-color-focus-ring); outline-offset: var(--fvl-stroke-focus-offset); }
  .btn.primary { background: var(--fvl-color-accent-default); color: var(--fvl-color-text-on-accent); }
  .btn.primary:hover { background: var(--fvl-color-accent-hover); }
  .btn.secondary { background: var(--fvl-color-bg-sunken); color: var(--fvl-color-text-primary); }
  .btn.secondary:hover { background: var(--fvl-color-bg-hover); }
  .btn.hold { touch-action: none; margin-left: auto; }
  .btn.hold.held { background: var(--fvl-color-bg-selected); color: var(--fvl-color-accent-text); transform: scale(0.97); }
  .btn[hidden] { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <h1 class="title">Two Seats of Time</h1>
      <span class="seat" id="seat" data-seat="inside">Inside</span>
    </div>
    <div class="row">
      <span class="chapter-name" id="chapterName">1 · The two seats</span>
    </div>
    <div class="chapters" id="chapters"><span class="current"></span><span></span><span></span><span></span></div>
  </header>

  <section class="stage" id="stage" aria-label="The path">
    <svg id="scene" viewBox="0 0 320 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A path through fog">
      <defs>
        <radialGradient id="fogGrad" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="100">
          <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="fog" maskUnits="userSpaceOnUse" x="-10000" y="-10000" width="20000" height="20000">
          <circle id="fogCircle" cx="0" cy="0" r="100" fill="url(#fogGrad)"/>
        </mask>
      </defs>
      <g id="world">
        <g id="tree" mask="url(#fog)">
          <g id="segs"></g>
          <g id="marks"></g>
          <g id="prints"></g>
        </g>
        <g id="fx"></g>
        <circle id="walker" class="walker" r="6"/>
      </g>
    </svg>
  </section>

  <div class="card">
    <p id="caption" aria-live="polite"></p>
    <div class="actions" id="actions">
      <button class="btn primary" id="act1" type="button" hidden></button>
      <button class="btn secondary" id="act2" type="button" hidden></button>
      <button class="btn secondary hold" id="hold" type="button" aria-pressed="false">Hold to trust</button>
    </div>
  </div>
</div>

<script src="/apps/vendor/gsap/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- FVL motion → GSAP ----------
  const css = getComputedStyle(document.documentElement);
  const token = (n) => css.getPropertyValue(n).trim();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function linearEase(str) {
    const m = str.match(/linear\(([^)]*)\)/);
    if (!m) return 'power2.out';
    const pts = m[1].split(',').map(Number).filter((n) => !isNaN(n));
    if (pts.length < 2) return 'power2.out';
    const n = pts.length - 1;
    return (p) => {
      if (p <= 0) return pts[0];
      if (p >= 1) return pts[n];
      const i = Math.floor(p * n), f = p * n - i;
      return pts[i] + (pts[i + 1] - pts[i]) * f;
    };
  }
  const seconds = (n) => (reduced ? 0 : parseFloat(token(n)) / 1000 || 0.6);
  const spring = {};
  ['settle', 'arrive', 'grow', 'carve'].forEach((k) => {
    gsap.registerEase('fvl-' + k, linearEase(token('--fvl-motion-spring-' + k + '-easing')));
    spring[k] = { ease: 'fvl-' + k, duration: seconds('--fvl-motion-spring-' + k + '-duration') };
  });
  const breatheAmp = parseFloat(token('--fvl-motion-loop-breathe-amplitude')) || 0.045;
  const breatheRate = parseFloat(token('--fvl-motion-loop-breathe-rate')) || 1.3;

  // ---------- the tree ----------
  // One walked path (the trunk, 0..END) with open branches at three forks. Up the screen is forward.
  const STEP = 56, END = 40;
  const FORKS = { 10: 'fire', 20: 'crown', 30: 'garden' };
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const svg = $('scene'), world = $('world'), segsG = $('segs'), marksG = $('marks'), printsG = $('prints'), fx = $('fx');
  const walker = $('walker'), fogCircle = $('fogCircle'), fogGrad = $('fogGrad');

  const main = [];
  for (let i = 0; i <= END; i++) main.push({ x: 26 * Math.sin(i * 0.55) + 8 * Math.sin(i * 1.7), y: -i * STEP });

  const branches = []; // {id, fork, pts:[...], seg:[els], sub:[branch ids]}
  function branch(id, fork, dir, len, lean) {
    const o = main[fork];
    const pts = [o];
    for (let j = 1; j <= len; j++) pts.push({ x: o.x + dir * (j * STEP * lean) + 6 * Math.sin(j * 1.3), y: o.y - j * STEP * 0.92 });
    const b = { id, fork, pts, segs: [] };
    branches.push(b);
    return b;
  }
  // chapter 2: the furnace — one open branch (the fire burns)
  branch('fire-burns', 10, 1, 5, 0.75);
  // chapter 3: the crown — two open branches, each opening again
  const l = branch('crown-left', 20, -1, 6, 0.7);
  const r = branch('crown-right', 20, 1, 6, 0.7);
  function subBranch(id, parent, at, dir, len) {
    const o = parent.pts[at];
    const pts = [o];
    for (let j = 1; j <= len; j++) pts.push({ x: o.x + dir * j * STEP * 0.6, y: o.y - j * STEP * 0.9 });
    const b = { id, fork: null, pts, segs: [] };
    branches.push(b);
  }
  subBranch('crown-left-a', l, 3, -1, 3);
  subBranch('crown-right-a', r, 3, 1, 3);
  // chapter 4: the garden — one open branch (the cup passes)
  branch('cup-passes', 30, -1, 5, 0.75);

  function line(cls, a, b, parent) {
    const el = document.createElementNS(NS, 'line');
    el.setAttribute('class', cls);
    el.setAttribute('x1', a.x); el.setAttribute('y1', a.y); el.setAttribute('x2', b.x); el.setAttribute('y2', b.y);
    (parent || segsG).appendChild(el);
    return el;
  }
  const mainSegs = [];
  for (let i = 0; i < END; i++) mainSegs.push(line('seg walked', main[i], main[i + 1]));
  branches.forEach((b) => { for (let j = 0; j < b.pts.length - 1; j++) b.segs.push(line('seg open', b.pts[j], b.pts[j + 1])); });

  // fork dots, fire, end mark
  function circle(cls, p, r, parent) {
    const el = document.createElementNS(NS, 'circle');
    el.setAttribute('class', cls); el.setAttribute('cx', p.x); el.setAttribute('cy', p.y); el.setAttribute('r', r);
    (parent || marksG).appendChild(el);
    return el;
  }
  Object.keys(FORKS).forEach((k) => circle('fork', main[+k], 4));
  branches.filter((b) => b.fork === null).forEach((b) => circle('fork', b.pts[0], 3));
  // the furnace sits on the open branch of fork 1
  (function () {
    const p = branches[0].pts[3];
    const g = document.createElementNS(NS, 'path');
    g.setAttribute('class', 'fire');
    g.setAttribute('d', `M${p.x - 10},${p.y + 10} q10,-6 6,-18 q8,6 6,18 q-10,10 -24,0 z`);
    marksG.appendChild(g);
  })();
  (function () {
    const p = main[END];
    const g = document.createElementNS(NS, 'path');
    g.setAttribute('class', 'end');
    g.setAttribute('d', `M${p.x},${p.y - 16} v26 M${p.x - 9},${p.y - 6} h18`);
    marksG.appendChild(g);
  })();

  const bounds = (() => {
    const all = main.concat(...branches.map((b) => b.pts));
    const xs = all.map((p) => p.x), ys = all.map((p) => p.y);
    return { minX: Math.min(...xs) - 60, maxX: Math.max(...xs) + 60, minY: Math.min(...ys) - 70, maxY: Math.max(...ys) + 70 };
  })();

  // ---------- footprints ----------
  const printAt = (p, i, his) => {
    const el = document.createElementNS(NS, 'ellipse');
    el.setAttribute('class', his ? 'print his' : 'print');
    el.setAttribute('cx', p.x + (i % 2 ? 7 : -7)); el.setAttribute('cy', p.y);
    el.setAttribute('rx', 2.6); el.setAttribute('ry', 4.2);
    printsG.appendChild(el);
    return el;
  };
  const hisPrints = [];
  function layHisPrints() {
    if (hisPrints.length) return;
    for (let i = 0; i <= END; i++) hisPrints.push(printAt(main[i], i, true));
    const cup = branches.find((b) => b.id === 'cup-passes');
    cup.pts.slice(1).forEach((p, j) => hisPrints.push(printAt(p, j, true)));
    gsap.set(hisPrints, { opacity: 0 });
    gsap.to(hisPrints, { opacity: 1, stagger: reduced ? 0 : 0.02, duration: spring.grow.duration, ease: 'fvl-grow' });
  }

  // ---------- camera and fog ----------
  const INSIDE_W = 320, FOG_R = STEP * 1.7;
  const cam = { cx: main[0].x, cy: main[0].y, w: INSIDE_W, fog: FOG_R };
  function aspect() { const b = svg.getBoundingClientRect(); return b.width ? b.height / b.width : 1.6; }
  function applyCam() {
    const h = cam.w * aspect();
    svg.setAttribute('viewBox', `${cam.cx - cam.w / 2} ${cam.cy - h / 2} ${cam.w} ${h}`);
    fogCircle.setAttribute('r', cam.fog); fogGrad.setAttribute('r', cam.fog);
  }
  addEventListener('resize', applyCam);
  function outsideBox() {
    const w = bounds.maxX - bounds.minX, h = bounds.maxY - bounds.minY;
    const W = Math.max(w, h / aspect());
    return { cx: (bounds.minX + bounds.maxX) / 2, cy: (bounds.minY + bounds.maxY) / 2, w: W };
  }

  // ---------- state ----------
  let seat = 'inside', pos = 0, chapter = 1, waiting = null, walkCall = null, ended = false;
  const state = { fire: null, crown: null, bet: null, prayed: new Set() };
  const seatEl = $('seat'), captionEl = $('caption'), act1 = $('act1'), act2 = $('act2'), hold = $('hold');
  const chapterName = $('chapterName'), chapterBars = $('chapters').children;
  const NAMES = ['1 · The two seats', '2 · But if not', '3 · The seed and the tree', '4 · Author and finisher'];
  let captionTimer = null;
  function say(html, revertAfter) {
    captionEl.innerHTML = html;
    if (captionTimer) captionTimer.kill();
    if (revertAfter) captionTimer = gsap.delayedCall(revertAfter, () => { if (seat === 'inside' && !waiting) captionEl.innerHTML = idleLine(); });
  }
  function actions(a, b) {
    [[act1, a], [act2, b]].forEach(([el, def]) => {
      if (!def) { el.hidden = true; el.onclick = null; return; }
      el.hidden = false; el.textContent = def.label; el.onclick = def.run;
    });
  }
  function setChapter(c) {
    chapter = c;
    chapterName.textContent = NAMES[c - 1];
    Array.from(chapterBars).forEach((el, i) => { el.className = i + 1 < c ? 'done' : i + 1 === c ? 'current' : ''; });
  }
  function idleLine() {
    switch (chapter) {
      case 1: return '<b>Inside.</b> The path exists one step ahead. Your prints fade behind. Tap where you stand to pray.';
      case 2: return state.fire === 'commit' ? 'Walking on. The commitment is already finished.' : 'Walking on. Nothing of yours was fixed.';
      case 3: return state.crown ? 'The branches close behind you into one trunk. That is the fixed past.' : 'Walking on.';
      case 4: return 'Prints ahead of yours. Someone walked this first. Follow them.';
    }
    return '';
  }

  // ---------- walking ----------
  function moveWalkerTo(p, tween) {
    if (tween) {
      gsap.to(walker, { attr: { cx: p.x, cy: p.y }, ...spring.arrive });
      gsap.to(cam, { cx: p.x, cy: p.y, ...spring.arrive, onUpdate: applyCam });
      gsap.to(fogCircle, { attr: { cx: p.x, cy: p.y }, ...spring.arrive });
      gsap.to(fogGrad, { attr: { cx: p.x, cy: p.y }, ...spring.arrive });
    } else {
      walker.setAttribute('cx', p.x); walker.setAttribute('cy', p.y);
      fogCircle.setAttribute('cx', p.x); fogCircle.setAttribute('cy', p.y);
      fogGrad.setAttribute('cx', p.x); fogGrad.setAttribute('cy', p.y);
      cam.cx = p.x; cam.cy = p.y; applyCam();
    }
  }
  const myPrints = [];
  function step() {
    if (seat !== 'inside' || waiting || ended) return;
    if (pos >= END) { finish(); return; }
    myPrints.push(printAt(main[pos], pos, false));
    pos += 1;
    moveWalkerTo(main[pos], true);
    arrive(pos);
    schedule();
  }
  function schedule(delay) {
    if (walkCall) walkCall.kill();
    walkCall = gsap.delayedCall(delay ?? (reduced ? 2.4 : 1.9), step);
  }
  function pause(fn) { waiting = fn; if (walkCall) walkCall.kill(); }
  function resume(delay) { waiting = null; actions(null, null); schedule(delay); }

  function arrive(i) {
    if (i === 10) {
      setChapter(2);
      pause(true);
      say('<b>The path forks.</b> One way the fire goes out, the other it burns. From here you cannot see which. Say it before you know.');
      actions(
        { label: 'But if not', run: () => {
          state.fire = 'commit';
          commitBranches(10);
          say('<b>Said.</b> "If he delivers us, good. But if not, we will not serve." Finished before the outcome.');
          resume(2.2);
        } },
        { label: 'Wait and see', run: () => {
          state.fire = 'wait';
          say('Only waiting. Nothing asked, nothing let go, nothing fixed.');
          resume(2.2);
        } }
      );
    } else if (i === 12) {
      say(state.fire === 'commit'
        ? '<b>The fire went out.</b> It would have held on the other branch too. The deliverance was for the king watching, not the reason for the faith.'
        : '<b>The fire went out.</b> You were carried past it. Nothing of yours was in it.', 6);
    } else if (i === 20) {
      setChapter(3);
      pause(true);
      say('<b>From inside the future is a tree.</b> Three ways ahead, each opening onto more. A wish bets on one branch. Faith is said on all of them.');
      actions(
        { label: 'But if not', run: () => {
          state.crown = 'commit';
          commitBranches(20);
          say('<b>Said on every branch.</b> It leaves the weather open and fixes the one thing that was yours to fix: what you do at the fork.');
          resume(2.4);
        } },
        { label: 'Bet on one', run: () => {
          const pick = ['main', 'crown-left', 'crown-right'][Math.floor(Math.random() * 3)];
          state.crown = 'bet'; state.bet = pick;
          betOn(20, pick);
          say(`<b>A wish, placed on one branch.</b> ${pick === 'main' ? 'It may land. It still fixes nothing.' : 'If the walk goes another way, it goes dark.'}`);
          resume(2.4);
        } }
      );
    } else if (i === 22) {
      if (state.crown === 'bet') {
        const landed = state.bet === 'main';
        if (!landed) branches.find((b) => b.id === state.bet).segs[0].classList.add('dark');
        say(landed ? '<b>The wish happened to land.</b> It fixed nothing; the branch was never yours to pick.'
                   : '<b>The wish went dark</b> on the branch that was not walked. The commitment would still be here.', 6);
      } else if (state.crown === 'commit') {
        say('<b>The commitment held.</b> The other branches close behind you. Faith fixes the self and releases the world.', 6);
      }
    } else if (i === 29) {
      setChapter(4);
      pause(true);
      layHisPrints();
      say('<b>Prints ahead of yours.</b> Someone stood exactly here first, not reading ahead, and walked it. At the fork his prints go onto every branch.');
      actions({ label: 'Follow', run: () => resume(0.6) }, null);
    } else if (i === 31) {
      say('<b>Begun on every branch, finished on the one walked.</b> "Not my will, but yours" was the first "but if not", said from inside with a real will.', 7);
    } else if (i === 36) {
      say('Faith is not blind. It follows footprints.', 5);
    }
  }

  function commitBranches(fork) {
    mainSegs[fork].classList.add('commit');
    branches.filter((b) => b.fork === fork).forEach((b) => b.segs[0].classList.add('commit'));
  }
  function betOn(fork, id) {
    (id === 'main' ? mainSegs[fork] : branches.find((b) => b.id === id).segs[0]).classList.add('bet');
  }

  function finish() {
    ended = true;
    pause(true);
    say('<b>It is finished.</b> One path, four chapters: two seats joined by trust; a faith finished before the outcome; said on every branch; walked first by the author. Hold to trust and see the whole of it.');
    actions({ label: 'Walk again', run: () => location.reload() }, null);
  }

  // ---------- breathe ----------
  gsap.ticker.add((t) => {
    if (seat !== 'inside' || reduced) return;
    walker.setAttribute('r', 6 * (1 + breatheAmp * Math.sin(t * breatheRate)));
  });

  // ---------- the bridge ----------
  function enterOutside() {
    if (seat === 'outside') return;
    seat = 'outside';
    seatEl.dataset.seat = 'outside'; seatEl.textContent = 'Outside';
    hold.classList.add('held'); hold.setAttribute('aria-pressed', 'true');
    if (walkCall) walkCall.kill();
    gsap.killTweensOf(cam);
    const box = outsideBox();
    gsap.to(cam, { ...box, fog: 20000, ...spring.settle, onUpdate: applyCam });
    walker.setAttribute('r', 6);
    const n = state.prayed.size;
    say('<b>Outside.</b> The whole path at once. Nothing moves; there is no now. The open branches are what a will could fix at each fork.' +
      (n ? ` ${n === 1 ? 'One lantern' : n + ' lanterns'} where you prayed — the path never bent.` : '') +
      (chapter >= 4 ? ' His prints run the whole way: the gap was crossed first, from the far side.' : ''));
  }
  function enterInside() {
    if (seat === 'inside') return;
    seat = 'inside';
    seatEl.dataset.seat = 'inside'; seatEl.textContent = 'Inside';
    hold.classList.remove('held'); hold.setAttribute('aria-pressed', 'false');
    gsap.killTweensOf(cam);
    gsap.to(cam, { cx: main[pos].x, cy: main[pos].y, w: INSIDE_W, fog: FOG_R, ...spring.arrive, onUpdate: applyCam, onComplete: () => { if (!waiting && !ended) schedule(0.6); } });
    say(waiting ? captionEl.innerHTML : idleLine());
  }
  hold.addEventListener('pointerdown', (e) => { e.preventDefault(); hold.setPointerCapture(e.pointerId); enterOutside(); });
  ['pointerup', 'pointercancel'].forEach((ev) => hold.addEventListener(ev, enterInside));
  hold.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); enterOutside(); } });
  hold.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') enterInside(); });
  hold.addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('blur', enterInside);

  // ---------- inside: looking ahead fails, tapping prays ----------
  const stage = $('stage');
  let drag = null;
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  svg.addEventListener('pointerdown', (e) => {
    if (seat !== 'inside') return;
    svg.setPointerCapture(e.pointerId);
    drag = { x0: e.clientX, y0: e.clientY, moved: 0 };
    gsap.killTweensOf(world);
  });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    drag.moved = Math.max(drag.moved, Math.abs(dx), Math.abs(dy));
    const scale = cam.w / svg.getBoundingClientRect().width;
    gsap.set(world, { x: 24 * Math.tanh((dx * scale) / 140), y: 24 * Math.tanh((dy * scale) / 140) });
  });
  function endDrag(e) {
    if (!drag) return;
    const d = drag; drag = null;
    gsap.to(world, { x: 0, y: 0, ...spring.arrive });
    if (d.moved > 10) {
      // worry: the fog flares and closes again
      gsap.fromTo(cam, { fog: FOG_R * 1.35 }, { fog: FOG_R, ...spring.settle, onUpdate: applyCam });
      say(chapter === 3
        ? '<b>Worry.</b> Reaching for the whole tree from inside, and failing. Stay at your point; the tree is held.'
        : '<b>No.</b> From inside you cannot look ahead, and you cannot look back past the trace.', 3);
      return;
    }
    if (e && e.type === 'pointerup') tryPray(e);
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  function tryPray(e) {
    const p = main[pos];
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    if (Math.hypot(q.x - p.x, q.y - p.y) > 26) return;
    const first = !state.prayed.has(pos);
    if (first) { state.prayed.add(pos); circle('lantern', p, 10); }
    const ring = circle('ripple', p, 6, fx);
    gsap.to(ring, { attr: { r: 56 }, opacity: 0, ...spring.grow, onComplete: () => ring.remove() });
    say(first ? '<b>Prayer.</b> A lantern where you stand. You see where you are more clearly; the path did not bend.'
              : 'Still lit. Still the same path.', 3);
  }

  // ---------- start ----------
  applyCam();
  moveWalkerTo(main[0], false);
  say(idleLine());
  gsap.delayedCall(1.6, () => schedule(0));
})();
</script>
</body>
</html>

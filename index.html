<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apps</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fafafa; --muted: #777; --line: #e3e3e3; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #111; --muted: #999; --line: #2a2a2a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a { display: block; padding: 16px 0; color: var(--fg); text-decoration: none; }
  li a:active { opacity: .6; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>apps</h1>
  <p>Live. Each app gets its own folder and shows up in this list.</p>
  <ul id="list">
    <li><a href="/apps/two-seats/">Two Seats of Time <small>— the score seen from inside and outside</small></a></li>
    <li><a href="/apps/scripturebridge/">ScriptureBridge <small>— prophecy and cross-reference explorer across all 66 books</small></a></li>
  </ul>
</main>
</body>
</html>
